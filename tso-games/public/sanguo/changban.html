<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>趙雲七進七出・長坂坡</title>
<!-- TSO：本檔併入 TSO Games 時的修改處，都以「TSO：」註記 -->
<!-- TSO：未登入就退回 TSO 首頁（比照遊戲島，只擋一般使用者） -->
<script>try { if (sessionStorage.getItem('tsoAuth') !== 'ok') location.replace('../'); } catch (e) { location.replace('../'); }</script>
<style>
  :root{
    --ink:#1d1814; --paper:#efe6d2; --paper2:#ddccab;
    --steel:#46586a; --steel-d:#2c3a48; --red:#b23a2a; --red-d:#86291c; --gold:#c79a4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
    background:radial-gradient(120% 95% at 50% 8%, #2c2620 0%, #1c1813 60%, #100d0a 100%);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:10px; user-select:none; -webkit-user-select:none;
  }
  #game{
    position:relative; width:100%; max-width:880px; aspect-ratio:800/560;
    /* TSO：寬度也受高度限制，手機橫拿時才不會裁掉上下（20px＝body 上下 padding） */
    max-width:min(880px, calc((100vh - 20px) * 800 / 560));
    max-width:min(880px, calc((100dvh - 20px) * 800 / 560));
    border-radius:18px; overflow:hidden;
    box-shadow:0 16px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
    background:#b59a6c;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none;}
  #top{
    position:absolute; left:0; top:0; right:0;
    display:flex; gap:8px; align-items:center; padding:10px; pointer-events:none; z-index:5;
  }
  #top .sp{flex:1;}
  .iconbtn{
    pointer-events:auto; width:44px; height:44px; border:none; border-radius:12px;
    background:rgba(28,34,42,.82); color:#e7ddc8; font-size:20px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  .iconbtn.off{opacity:.42;}
  #backbtn{margin-right:auto; padding:0 14px; width:auto; font-size:16px; font-weight:700;}
  #card{
    position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center;
    padding:22px; background:rgba(8,6,4,.5); opacity:0; visibility:hidden; transition:opacity .25s;
  }
  #card.show{opacity:1; visibility:visible;}
  .panel{
    width:min(92%,560px); background:linear-gradient(180deg,var(--paper),var(--paper2));
    border-radius:16px; padding:26px 24px 22px; text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,.5); border:2px solid #c9b487;
  }
  .panel .tag{font-size:14px; letter-spacing:3px; color:#9a6a32; font-weight:800;}
  .panel h1{margin:.2em 0 .15em; font-size:clamp(22px,5.4vw,32px); color:#5a2f18;}
  .panel p{margin:.5em 0 0; font-size:clamp(15px,3.7vw,19px); line-height:1.7; color:#433523; white-space:pre-line;}
  .row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
  .bigbtn{
    border:none; cursor:pointer; font-size:clamp(18px,4.4vw,22px); font-weight:800; color:#fff;
    padding:13px 28px; border-radius:14px;
    background:linear-gradient(180deg,#c44a38,var(--red)); box-shadow:0 5px 0 var(--red-d), 0 8px 18px rgba(120,30,15,.4);
  }
  .bigbtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--red-d);}
  .bigbtn.ghost{background:linear-gradient(180deg,#5a6b7c,var(--steel)); color:#eef3f8; box-shadow:0 5px 0 var(--steel-d);}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="top">
    <button id="backbtn" class="iconbtn">↩ 地圖</button>
    <span class="sp"></span>
    <button id="readbtn" class="iconbtn" title="旁白">🔊</button>
    <button id="soundbtn" class="iconbtn" title="聲音">🎵</button>
  </div>
  <div id="card"><div class="panel" id="panel"></div></div>
</div>
<script>
(function(){
"use strict";

/* ===== 基本常數與畫布 ===== */
const W=800, H=560;                       // 邏輯視窗（攝影機視野）
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const card=document.getElementById('card'), panel=document.getElementById('panel');
const backbtn=document.getElementById('backbtn');
const readbtn=document.getElementById('readbtn'), soundbtn=document.getElementById('soundbtn');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let DPR=Math.min(2, window.devicePixelRatio||1);
let progress=0;                            // 已完成關數（目前只開放第一關）
/* TSO：記住已過幾關。只存一個整數，讀回時檢查範圍，不合法就清掉從頭開始。
   青釭劍、懷阿斗都是進關時依 progress 算出來的，存這個整數就能完整還原 */
const SAVE_KEY='sanguo_changban_progress', MAX_PROGRESS=7;
try{ const n=Number(localStorage.getItem(SAVE_KEY));
  if(Number.isInteger(n) && n>=0 && n<=MAX_PROGRESS) progress=n; else localStorage.removeItem(SAVE_KEY); }catch(e){}
let savedProgress=progress;

function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ===== 小工具 ===== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function rrFill(x,y,w,h,r,col){ ctx.fillStyle=col; rr(x,y,w,h,r); ctx.fill(); }
function rrStroke(x,y,w,h,r,col,lw){ ctx.strokeStyle=col; ctx.lineWidth=lw||1; rr(x,y,w,h,r); ctx.stroke(); }
function collideTrees(o, trees, pad){ if(!trees)return; for(const tr of trees){ const ex=o.x-tr.x, ey=o.y-tr.y, ed=Math.hypot(ex,ey)||1; const m=tr.r+pad; if(ed<m){ o.x=tr.x+ex/ed*m; o.y=tr.y+ey/ed*m; } } }
function drawThicket(t){ ctx.save(); ctx.translate(t.x,t.y);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(5,t.r*0.55,t.r*1.05,t.r*0.5,0,0,7); ctx.fill();
  ctx.fillStyle='#33502a'; for(let i=0;i<5;i++){ const a=i/5*7; ctx.beginPath(); ctx.arc(Math.cos(a)*t.r*0.5,Math.sin(a)*t.r*0.42,t.r*0.58,0,7); ctx.fill(); }
  ctx.fillStyle='#46683a'; ctx.beginPath(); ctx.arc(0,-2,t.r*0.72,0,7); ctx.fill();
  ctx.fillStyle='#577f44'; for(let i=0;i<6;i++){ const a=i/6*7+0.4; ctx.beginPath(); ctx.arc(Math.cos(a)*t.r*0.42,Math.sin(a)*t.r*0.32-4,t.r*0.3,0,7); ctx.fill(); }
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.beginPath(); ctx.arc(-t.r*0.2,-t.r*0.3,t.r*0.3,0,7); ctx.fill();
  ctx.restore(); }
function drawMount(x,y,ang,col,opts){ opts=opts||{}; ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,7,19,8,0,0,7); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=3; ctx.lineCap='round';                                  // 腿
  ctx.beginPath(); ctx.moveTo(-7,5); ctx.lineTo(-9,11); ctx.moveTo(7,5); ctx.lineTo(9,11); ctx.moveTo(-2,6); ctx.lineTo(-3,11); ctx.moveTo(11,4); ctx.lineTo(12,10); ctx.stroke();
  ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(0,0,17,7.5,0,0,7); ctx.fill();               // 身
  ctx.beginPath(); ctx.ellipse(15,-3,7,4.5,0.3,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(21,-5,4,3,0.3,0,7); ctx.fill(); // 頸＋頭（前方+x）
  ctx.fillStyle=opts.mane||'#1c1c20'; ctx.beginPath(); ctx.ellipse(8,-4,4.5,3,0,0,7); ctx.fill(); ctx.fillRect(-21,-2,6,4); // 鬃＋尾
  ctx.restore(); }
function ctext(str,x,y,size,col,weight,align){ ctx.fillStyle=col||'#fff';
  ctx.font=(weight||700)+' '+size+'px '+FONT; ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillText(str,x,y); }

/* ===== 粒子（物件池，零圖檔） ===== */
const P=[];
function pPush(o){ if(P.length<560) P.push(o); }
function emitDust(x,y,n){ n=reduce?Math.ceil(n/2):n; for(let i=0;i<n;i++)
  pPush({k:'dust',x:x+rand(-6,6),y:y+rand(-6,6),vx:rand(-40,40),vy:rand(-46,-8),g:30,life:rand(.5,1.1),max:1.1,r:rand(5,11),col:'rgba(150,130,98,'}); }
function emitBlood(x,y,n){ n=reduce?Math.ceil(n/2):n; for(let i=0;i<n;i++)
  pPush({k:'blood',x:x,y:y,vx:rand(-110,110),vy:rand(-150,-30),g:340,life:rand(.4,.8),max:.8,r:rand(2,4),col:'rgba(168,42,30,'}); }
function emitSteel(x,y,n){ for(let i=0;i<n;i++)
  pPush({k:'spark',x:x,y:y,vx:rand(-120,120),vy:rand(-150,-40),g:300,life:rand(.25,.55),max:.55,r:rand(2,3.5),col:'rgba(224,228,238,'}); }
function winFanfare(){ for(let i=0;i<34;i++)
  pPush({k:'spark',x:W/2+rand(-130,130),y:H/2+rand(-50,40),vx:rand(-150,150),vy:rand(-230,-70),g:260,life:rand(.8,1.5),max:1.5,r:rand(3,6),col:(i%3?'rgba(231,196,120,':'rgba(224,228,238,')}); }
function updateP(dt){ for(let i=P.length-1;i>=0;i--){ const p=P[i];
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt; p.life-=dt; if(p.life<=0) P.splice(i,1); } }
function drawP(){
  ctx.globalCompositeOperation='lighter';
  for(const p of P){ if(p.k!=='spark')continue; const a=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col+a+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalCompositeOperation='source-over';
  for(const p of P){ if(p.k==='spark')continue; const a=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col+(a*.8)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } }

/* ===== 畫面震動 / 浮字 ===== */
let shakeT=0, shakeAmt=0;
function shake(a){ if(reduce)return; shakeT=Math.max(shakeT,0.32); shakeAmt=Math.max(shakeAmt,a*10); }
let toast=null, toastT=0;
function flash(msg){ toast=msg; toastT=1.4; }

/* ===== 音效（WebAudio 合成，零音檔） ===== */
let actx=null, soundOn=true, readOn=true;
function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tone(f,dur,type,vol,when){ if(!soundOn)return; const a=AC(); if(!a)return;
  const t0=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.3,t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.03); }
function noise(dur,vol,ff,when){ if(!soundOn)return; const a=AC(); if(!a)return;
  const t0=a.currentTime+(when||0), len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(); src.buffer=buf;
  const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=ff||1200;
  const g=a.createGain(); g.gain.value=vol||.3;
  src.connect(fl).connect(g).connect(a.destination); src.start(t0); }
const SFX={
  tap:()=>tone(420,.05,'square',.1),
  swing:()=>{ noise(.1,.16,2200); tone(900,.05,'triangle',.06); },
  hit:()=>{ tone(200,.06,'square',.16); noise(.05,.13,2600); },
  kill:()=>{ tone(150,.1,'square',.16); noise(.09,.15,1600); },
  dash:()=>{ noise(.22,.2,1300); tone(520,.16,'sine',.1); },
  hurt:()=>{ tone(150,.2,'sawtooth',.22); noise(.1,.18,820); },
  win:()=>[440,587,740,988].forEach((f,i)=>tone(f,.28,'triangle',.22,i*.1)),
  lose:()=>{ tone(300,.25,'sine',.2); tone(200,.32,'sine',.18,.14); }
};
function tap(){ SFX.tap(); }

/* ===== 語音旁白 ===== */
function speak(text){ if(!readOn||!('speechSynthesis'in window))return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW'; u.rate=.98; u.pitch=1.0; speechSynthesis.speak(u); }catch(e){} }

/* ===== UI 卡片 ===== */
function showCard(o){
  let html='';
  if(o.tag) html+='<div class="tag">'+o.tag+'</div>';
  if(o.title) html+='<h1>'+o.title+'</h1>';
  if(o.body) html+='<p>'+o.body+'</p>';
  html+='<div class="row">';
  (o.buttons||[]).forEach((b,i)=>{ html+='<button class="bigbtn '+(b.cls||'')+'" data-i="'+i+'">'+b.label+'</button>'; });
  html+='</div>';
  panel.innerHTML=html; card.classList.add('show');
  panel.querySelectorAll('.bigbtn').forEach(btn=>{ btn.onclick=()=>{ const b=(o.buttons||[])[+btn.dataset.i]; tap(); if(b&&b.go)b.go(); }; });
  if(o.narrate) speak(o.narrate);
}
function hideCard(){ card.classList.remove('show'); }

/* ===== 場景管理 ===== */
let scene=null;
function setScene(s,name){ hideCard(); P.length=0; toastT=0; shakeT=0; resetInput(); scene=s;
  backbtn.style.display=(name&&name.indexOf('level')===0)?'flex':'none';
  if(s&&s.enter) s.enter(); }

/* ===== 輸入 ===== */
let cam={x:0,y:0};                          // 攝影機中心（世界座標）
let ptr={down:false,moved:false,downAt:0,sx:0,sy:0,wx:0,wy:0};
let keys={};
function resetInput(){ ptr.down=false; ptr.moved=false; keys={}; }
function evToScreen(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
function screenToWorld(sx,sy){ return { x: sx - W/2 + cam.x, y: sy - H/2 + cam.y }; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); AC();
  const s=evToScreen(e); ptr.down=true; ptr.moved=false; ptr.downAt=nowt; ptr.sx=s.x; ptr.sy=s.y;
  const w=screenToWorld(s.x,s.y); ptr.wx=w.x; ptr.wy=w.y;
  if(scene&&scene.onDown)scene.onDown(s.x,s.y); });
cv.addEventListener('pointermove',e=>{ const s=evToScreen(e);
  if(ptr.down){ if(dist(s.x,s.y,ptr.sx,ptr.sy)>14) ptr.moved=true;
    const w=screenToWorld(s.x,s.y); ptr.wx=w.x; ptr.wy=w.y; }
  if(scene&&scene.onMove)scene.onMove(s.x,s.y); });
function ptrEnd(){ if(ptr.down){ const quick=(nowt-ptr.downAt)<0.25;
    if(!ptr.moved && quick && scene && scene.onTap) scene.onTap(); }
  ptr.down=false; if(scene&&scene.onUp)scene.onUp(); }
window.addEventListener('pointerup',ptrEnd);
window.addEventListener('pointercancel',ptrEnd);
window.addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true;
  if(e.key===' '||e.code==='Space'){ e.preventDefault(); if(scene&&scene.onTap)scene.onTap(); }
  if(scene&&scene.onKey)scene.onKey(e); });
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

readbtn.onclick=()=>{ readOn=!readOn; readbtn.classList.toggle('off',!readOn);
  if(!readOn&&'speechSynthesis'in window)speechSynthesis.cancel(); tap(); };
soundbtn.onclick=()=>{ soundOn=!soundOn; soundbtn.classList.toggle('off',!soundOn); tap(); };
backbtn.onclick=()=>{ tap(); setScene(MAP,'map'); };

/* ===========================================================
   角色繪製（俯視，零圖檔，全程式生成）
   =========================================================== */
function drawZhaoyun(x,y,ang,p){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,5,24,12,0,0,7); ctx.fill();
  // 受傷紅閃
  if(p.hurtFlash>0){ ctx.fillStyle='rgba(220,60,40,'+(p.hurtFlash*0.5)+')'; ctx.beginPath(); ctx.arc(0,0,30,0,7); ctx.fill(); }
  ctx.rotate(ang);
  // 白馬（體沿 +x 為前）
  ctx.fillStyle='#ece7da'; ctx.beginPath(); ctx.ellipse(0,0,22,11,0,0,7); ctx.fill();
  ctx.fillStyle='#d9d2c2'; ctx.beginPath(); ctx.ellipse(19,0,8,6,0,0,7); ctx.fill();   // 馬頭
  ctx.strokeStyle='#8a7c63'; ctx.lineWidth=3; ctx.lineCap='round';                      // 鬃
  ctx.beginPath(); ctx.moveTo(8,-6); ctx.lineTo(14,-2); ctx.moveTo(8,6); ctx.lineTo(14,2); ctx.stroke();
  ctx.strokeStyle='#bdb4a0'; ctx.lineWidth=4;                                            // 腿
  ctx.beginPath(); ctx.moveTo(-10,-9); ctx.lineTo(-14,-13); ctx.moveTo(-10,9); ctx.lineTo(-14,13);
  ctx.moveTo(10,-9); ctx.lineTo(13,-13); ctx.moveTo(10,9); ctx.lineTo(13,13); ctx.stroke();
  // 白袍（騎士身後展開）
  ctx.fillStyle='rgba(245,243,236,.92)'; ctx.beginPath();
  ctx.moveTo(-2,0); ctx.lineTo(-24,-12); ctx.lineTo(-28,0); ctx.lineTo(-24,12); ctx.closePath(); ctx.fill();
  // 騎士（銀甲）
  ctx.fillStyle='#c7cdd6'; ctx.beginPath(); ctx.arc(-1,0,8,0,7); ctx.fill();
  ctx.fillStyle='#e6cda4'; ctx.beginPath(); ctx.arc(2,0,4.5,0,7); ctx.fill();           // 頭/盔
  if(p.adou){ ctx.fillStyle='#caa46a'; ctx.beginPath(); ctx.ellipse(-3,-7,5,3.5,-0.4,0,7); ctx.fill();
    ctx.fillStyle='#f3ddb6'; ctx.beginPath(); ctx.arc(-1,-9,2,0,7); ctx.fill(); }            // 懷中阿斗
  // 槍（揮砍時掃動）
  let sp=0; if(p.swingT>0){ const a=(p.swingDur-p.swingT)/p.swingDur; sp=lerp(-1.05,1.05,a); }
  ctx.save(); ctx.rotate(sp);
  ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(2,0); ctx.lineTo(42,0); ctx.stroke();
  if(p.qinggang){ ctx.shadowColor='#7fe9ff'; ctx.shadowBlur=10; ctx.strokeStyle='#dffaff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(34,0); ctx.lineTo(56,0); ctx.stroke();
    ctx.fillStyle='#bff2ff'; ctx.beginPath(); ctx.moveTo(54,-4); ctx.lineTo(67,0); ctx.lineTo(54,4); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; }
  else { ctx.fillStyle='#d7dbe3'; ctx.beginPath(); ctx.moveTo(42,-3); ctx.lineTo(52,0); ctx.lineTo(42,3); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.restore();
  // 揮砍弧光（畫於世界、未旋轉之圖層外，放這裡疊在角色上）
  if(p.swingT>0){ const a=p.swingT/p.swingDur;
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    ctx.strokeStyle=(p.qinggang?'rgba(150,240,255,':'rgba(232,236,245,')+(a*0.7)+')'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,ATK_RANGE*0.86,-ATK_ARC,ATK_ARC); ctx.stroke();
    ctx.restore(); }
}
function drawSoldier(e){
  ctx.save(); ctx.translate(e.x,e.y);
  const sz=e.general?1.7:1;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,4*sz,9*sz,5*sz,0,0,7); ctx.fill();
  if(e.dead){ ctx.globalAlpha=Math.max(0,e.deadT/0.5); ctx.rotate(0.9); }
  const body = e.flash>0 ? '#e7eef7' : (e.general?'#7a2f2f':'#3a6ab8');
  ctx.rotate(e.ang);

   俯視動作核心參數
   =========================================================== */
const SPD=232, DASH_SPD=720, ENE_SPD=96, LADY_SPD=170;
const BOSS_SPD=112, WIND=0.78, SLAM=0.26, REC=1.15, SLAM_DMG=30, BOSS_TOUCH=6, RUN_SPD=118;
const ATK_INT=0.5, ATK_RANGE=80, ATK_ARC=1.92;   // 揮槍：間隔/半徑/半弧（約 ±110°）
const DASH_DUR=0.22, DASH_CD=1.35, IFRAME=0.30;

let adouHp=100, adouMax=100;            // 懷阿斗・安危（自己挨打就掉）
function makePlayer(x,y){ return { x:x,y:y, ang:Math.PI/2, vx:0,vy:0,
  hp:100, max:100, atkT:0, swingT:0, swingDur:0.2, dashT:0, dashCD:0, iframe:0, hitCD:0, hurtFlash:0,
  qinggang:false, adou:false, pitT:0 }; }
function tryDash(p){ if(p.dashCD>0||p.dashT>0)return; p.dashT=DASH_DUR; p.dashCD=DASH_CD; p.iframe=Math.max(p.iframe,IFRAME);
  SFX.dash(); shake(0.25); emitDust(p.x,p.y,10); }

function keyVec(){ let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy-=1; if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1; if(keys['d']||keys['arrowright'])dx+=1;
  return {dx:dx,dy:dy}; }

function updatePlayer(p,dt,world){
  // 計時器
  p.dashCD=Math.max(0,p.dashCD-dt); p.dashT=Math.max(0,p.dashT-dt);
  p.iframe=Math.max(0,p.iframe-dt); p.hitCD=Math.max(0,p.hitCD-dt);
  p.swingT=Math.max(0,p.swingT-dt); p.hurtFlash=Math.max(0,p.hurtFlash-dt*2.2);
  // 期望速度
  let vx=0,vy=0; const kv=keyVec();
  const held=nowt-ptr.downAt;
  if(ptr.down && (ptr.moved || held>=0.16)){
    const dx=ptr.wx-p.x, dy=ptr.wy-p.y, d=Math.hypot(dx,dy);
    if(d>6){ vx=dx/d*SPD; vy=dy/d*SPD; p.ang=Math.atan2(dy,dx); }
  } else if(kv.dx||kv.dy){
    const d=Math.hypot(kv.dx,kv.dy); vx=kv.dx/d*SPD; vy=kv.dy/d*SPD; p.ang=Math.atan2(kv.dy,kv.dx);
  }
  if(p.dashT>0){ vx=Math.cos(p.ang)*DASH_SPD; vy=Math.sin(p.ang)*DASH_SPD; emitDust(p.x,p.y,1); }
  p.x=clamp(p.x+vx*dt, 40, world.w-40); p.y=clamp(p.y+vy*dt, 40, world.h-40);
}

function spawnEnemy(x,y){ enemies.push({x:x,y:y,ang:0,hp:2,flash:0,atkCD:rand(.3,1),dead:false,deadT:0}); }
function stepAttack(L,dt){
  player.atkT+=dt; if(player.atkT<ATK_INT) return; player.atkT=0;
  const arc = ATK_ARC * (player.adou?0.78:1) * (player.qinggang?1.22:1);
  const rng = ATK_RANGE + (player.qinggang?14:0);
  let hitAny=false;
  for(const e of enemies){ if(e.dead)continue; const dx=e.x-player.x, dy=e.y-player.y, d=Math.hypot(dx,dy);
    if(d<=rng){ let da=Math.atan2(dy,dx)-player.ang; da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<=arc){ hitAny=true; const dmg=player.qinggang?(e.general?4:99):1; e.hp-=dmg; e.flash=0.12;
        const k=42; e.x+=dx/d*k; e.y+=dy/d*k; emitSteel((player.x+e.x)/2,(player.y+e.y)/2,player.qinggang?5:3);
        if(e.hp<=0){ e.dead=true; e.deadT=0.6; L.kills++; emitBlood(e.x,e.y,e.champion?0:6); SFX.kill(); } } } }
  if(hitAny){ player.swingT=player.swingDur; SFX.hit(); }
  else if(enemyNear(player,rng)){ player.swingT=player.swingDur; SFX.swing(); }
}
function stepEnemies(L,dt){
  for(const e of enemies){
    if(e.dead){ e.deadT-=dt; continue; }
    e.flash=Math.max(0,e.flash-dt);
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1; e.ang=Math.atan2(dy,dx);
    const spd = e.champion ? ENE_SPD*0.72 : (e.general ? ENE_SPD*0.5 : ENE_SPD);
    if(d>30){ e.x+=dx/d*spd*dt; e.y+=dy/d*spd*dt; }
    if(player.dashT>0 && d<32){ e.hp-=1; e.flash=0.12; e.x-=dx/d*70; e.y-=dy/d*70; emitSteel(e.x,e.y,2);
      if(e.hp<=0){ e.dead=true; e.deadT=0.6; L.kills++; emitBlood(e.x,e.y,e.champion?0:5); SFX.kill(); } }
    e.atkCD-=dt;
    if(d<34 && e.atkCD<=0){ e.atkCD=1.0;
      if(player.iframe<=0 && player.hitCD<=0 && player.dashT<=0){
        player.hp-=9; player.hitCD=0.6; player.hurtFlash=1; player.x-=dx/d*16; player.y-=dy/d*16;
        emitBlood(player.x,player.y,5); SFX.hurt(); shake(0.3);
        if(player.adou) adouHp=Math.max(0,adouHp-11); } }
  }
  for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead && enemies[i].deadT<=0) enemies.splice(i,1);
}
function stepSpawn(L,dt,cap,rate){

  stepRunner(dt){
    runner.flash=Math.max(0,runner.flash-dt);
    let tox=this.gate.x-runner.x, toy=this.gate.y-runner.y, td=Math.hypot(tox,toy)||1;
    let ax=runner.x-player.x, ay=runner.y-player.y, ad=Math.hypot(ax,ay)||1;
    const av=clamp(170/ad,0,0.7);
    let px=-ay/ad, py=ax/ad; if((px*tox+py*toy)<0){ px=-px; py=-py; }
    // 繞開樹叢（躲貓貓的核心：他會鑽樹林、變線）
    let rxv=0, ryv=0;
    for(const tr of this.trees){ const ex=runner.x-tr.x, ey=runner.y-tr.y, ed=Math.hypot(ex,ey)||1; const reach=tr.r+78;

      ctx.fillStyle='#23232a'; ctx.beginPath(); ctx.arc(0,-6,13,0,7); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#e6cda4'; ctx.beginPath(); ctx.arc(0,-17,6.5,0,7); ctx.fill();                    // 面
      ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-5,-15); ctx.quadraticCurveTo(-9,-9,-6,-6); ctx.moveTo(5,-15); ctx.quadraticCurveTo(9,-9,6,-6); ctx.stroke(); // 虎鬚
      ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=4.5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(11,-6); ctx.lineTo(33,-46); ctx.stroke(); // 丈八蛇矛
      ctx.strokeStyle='#cdd3da'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(33,-46); ctx.quadraticCurveTo(38,-52,34,-56); ctx.stroke();
      ctx.restore(); })();
    ctext('張飛 據橋', tx, ty-40, 13, '#2a1a10', 800);
    // 結局：趙雲過橋獻子、劉備擲阿斗
    if(this.anim==='cross' || this.node==='ending'){
      const zy=SH*0.20 + (SH*0.58)*this.cross;
      drawMount(bx, zy, Math.PI/2, '#e8e4dc', {mane:'#c8c0b4'});                                // 白馬
      drawZhaoyun(bx, zy-3, Math.PI/2, {swingT:0,qinggang:true,adou:this.cross<0.96,hurtFlash:0,dashT:0});
      // 劉備（橋南）
      const lx=bx, ly=SH*0.82;
      ctx.save(); ctx.translate(lx,ly);
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,12,16,8,0,0,7); ctx.fill();
      ctx.fillStyle='#3a6a4a'; ctx.beginPath(); ctx.moveTo(-11,12); ctx.lineTo(11,12); ctx.lineTo(7,-8); ctx.lineTo(-7,-8); ctx.closePath(); ctx.fill(); // 綠袍
      ctx.fillStyle='#e6cda4'; ctx.beginPath(); ctx.arc(0,-13,6,0,7); ctx.fill();
      ctx.restore(); ctext('主公 劉備', lx, ly-22, 12, '#2a1a10', 800);
      if(this.cross>=0.96){ ctext('擲於地：「為汝這孺子，幾損我一員大將！」', bx, SH*0.5, 13, '#5a2a1a', 800); }
    }
    ctx.restore();
    // 疑懼表（頂端）
    rrFill(W/2-150,16,300,28,9,'rgba(20,16,10,.72)');
    rrFill(W/2-144,22,288*(this.fear/3),16,7, this.fear>=3?'#5ec07a':'#c89a3a');
    ctext('曹軍疑懼　'+fearBar(this.fear), W/2, 30, 14, '#fff', 800);
    // 底部敘事面板
    ctx.fillStyle='rgba(18,14,9,.85)'; ctx.fillRect(0,panelTop,W,H-panelTop);
    ctx.fillStyle='rgba(212,175,55,.5)'; ctx.fillRect(0,panelTop,W,2);
    let ty2=panelTop+24; for(const ln of lines){ ctext(ln, W/2, ty2, 15.5, '#f0e6d2', 600); ty2+=24; }
    if(!this.busy){ for(const r of rects){ rrFill(r.x,r.y,r.w,r.h,9,'#3a3027');
        rrStroke(r.x,r.y,r.w,r.h,9,'#7a6646',1.5); ctext(r.c.label, r.x+r.w/2, r.y+r.h/2+5, 15, '#ffe9b0', 700); } }
    else { ctext('· · ·', W/2, H-46, 18, 'rgba(255,255,255,.5)', 700); }
  }
};
function enemyNear(p,r){ for(const e of enemies){ if(!e.dead && dist(e.x,e.y,p.x,p.y)<=r) return true; } return false; }

function drawHUD(L,objText){
  // 血條
  rrFill(16,14,232,30,9,'rgba(20,16,10,.7)');
  rrFill(22,20,220,18,7,'rgba(120,40,30,.5)');
  const hp=clamp(player.hp/player.max,0,1); rrFill(22,20,220*hp,18,7, hp>0.3?'#c64132':'#8a261b');
  ctext('趙雲',54,29,15,'#ffe7a8',800);
  // 衝刺冷卻
  const cd=player.dashCD/DASH_CD; rrFill(16,50,160,22,8,'rgba(20,16,10,.7)');
  rrFill(20,54,152*(1-cd),14,6, cd>0?'#5a6b7c':'#5ec07a');
  ctext(cd>0?'衝刺充能…':'衝刺 就緒（輕點）',92,61,13,'#eef3f8',800);
  // 斬殺數
  rrFill(W-150,14,134,30,9,'rgba(20,16,10,.7)'); ctext('斬殺 '+L.kills,W-83,29,16,'#ffe7a8',800);
  // 目標字
  ctext(objText,W/2,28,18,'#fff8e8',800);
}
function drawEscortGauge(label,hp,max,danger){
  const x=W/2-130, y=52, w=260, r=clamp(hp/max,0,1);
  rrFill(x,y,w,22,8,'rgba(20,16,10,.72)');
  rrFill(x+4,y+4,(w-8)*r,14,6, r>0.35?'#5ec07a':'#d8543a');
  ctext(label+'　'+Math.ceil(hp),W/2,y+11,13, danger?'#ffd0c0':'#eaf7e6',800);
  if(danger){ ctx.strokeStyle='rgba(216,84,58,'+(0.5+0.4*Math.sin(performance.now()/90))+')'; ctx.lineWidth=2; rr(x,y,w,22,8); ctx.stroke(); }
}
function drawCompass(wx,wy,label){
  const dx=wx-player.x, dy=wy-player.y, d=Math.hypot(dx,dy);
  if(d<80) return; const a=Math.atan2(dy,dx);
  const mx=W/2+Math.cos(a)*210, my=H/2+Math.sin(a)*150;
  const cx=clamp(mx,40,W-40), cy=clamp(my,70,H-70);
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle='rgba(20,16,10,.72)'; ctx.beginPath(); ctx.arc(0,0,18,0,7); ctx.fill();
  ctx.rotate(a); ctx.fillStyle='#ffd576'; ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(2,-7); ctx.lineTo(2,7); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctext(label+' '+Math.round(d/10)+'m',cx,cy+28,13,'#ffe7a8',800);
}

/* ===========================================================
   地圖（七進七出選關，目前僅開放第一進）
   =========================================================== */
const STOPS=[
  {n:'一·尋主',   x:160,y:150, go:()=>setScene(L1,'level1')},
  {n:'二·救甘夫人',x:300,y:232, go:()=>setScene(L2,'level2')},
  {n:'三·救糜竺', x:470,y:178, go:()=>setScene(L3,'level3')},
  {n:'四·奪青釭', x:560,y:300, go:()=>setScene(L4,'level4')},
  {n:'五·懷阿斗', x:430,y:382, go:()=>setScene(L5,'level5')},
  {n:'六·斬將',   x:560,y:446, go:()=>setScene(L6,'level6')},
  {n:'七·過橋',   x:706,y:486, go:()=>setScene(L7,'level7')}
];
const MAP={
  enter(){ this.t=0; },
  onDown(x,y){ for(let i=0;i<STOPS.length;i++){ const s=STOPS[i];
    if(dist(x,y,s.x,s.y)<34){ tap(); if(i<=progress && s.go) s.go(); else flash('此進尚未開放，敬請期待'); return; } } },
  update(dt){ this.t+=dt; if(toastT>0)toastT-=dt; updateP(dt); },
  draw(){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#cdb486'); g.addColorStop(.55,'#b59a6c'); g.addColorStop(1,'#9a8156');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // 景山
    ctx.fillStyle='#9a8b5e'; ctx.beginPath(); ctx.moveTo(40,150); ctx.lineTo(110,40); ctx.lineTo(180,150); ctx.closePath(); ctx.fill();
    ctext('景山',110,120,14,'#5a4a2a',800); ctext('（曹操觀戰）',110,138,11,'#6a5a36',700);
    // 沮水・長坂橋
    ctx.fillStyle='rgba(90,120,140,.5)'; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(W,H); ctx.lineTo(W,H-46); ctx.quadraticCurveTo(W*0.6,H-72,0,H-40); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#7a5a36'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(676,520); ctx.lineTo(736,520); ctx.stroke();
    ctext('長坂橋',706,505,12,'#4a3a22',800);
    // 連線
    ctx.strokeStyle='rgba(70,55,30,.5)'; ctx.lineWidth=3; ctx.setLineDash([8,7]);
    ctx.beginPath(); ctx.moveTo(STOPS[0].x,STOPS[0].y); for(let i=1;i<STOPS.length;i++) ctx.lineTo(STOPS[i].x,STOPS[i].y); ctx.stroke(); ctx.setLineDash([]);
    ctext('趙雲七進七出 · 長坂坡 二〇八',W/2,40,26,'#5a2f18',900);
    ctext('單騎救主——擊破當前關卡解鎖下一進（已過關可重玩）',W/2,68,15,'#6a4a2a',700);
    for(let i=0;i<STOPS.length;i++){ const s=STOPS[i], open=i<=progress && !!s.go, done=i<progress, cur=i===progress && !!s.go;
      const r=30+(cur?Math.sin(this.t*3)*2:0);
      ctx.fillStyle=open?'#f3ead6':'rgba(150,135,105,.65)'; ctx.beginPath(); ctx.arc(s.x,s.y,r,0,7); ctx.fill();
      ctx.lineWidth=4; ctx.strokeStyle=done?'#5ec07a':(open?'#c44a38':'#7a6a48'); ctx.stroke();
      ctext(done?'✓':(open?'⚔':'🔒'),s.x,s.y,open?24:20,'#2a2018');
      rrFill(s.x-52,s.y+r+2,104,22,11, open?'rgba(60,30,18,.9)':'rgba(70,60,42,.8)');
      ctext(s.n,s.x,s.y+r+13,13,'#fff',800); }
    if(toastT>0){ ctx.globalAlpha=clamp(toastT,0,1); rrFill(W/2-170,H-58,340,36,11,'rgba(20,16,10,.82)');
      ctext(toast,W/2,H-40,16,'#ffe7a8',800); ctx.globalAlpha=1; }
  }
};

/* ===========================================================
   開場
   =========================================================== */
const TITLE={
  enter(){ this.t=0;
    showCard({tag:'建 安 十 三 年 · 長 坂 坡', title:'趙雲七進七出',
      body:'曹操虎豹騎一日一夜追三百餘里，當陽長坂衝散了劉備十餘萬眾。\n常山趙子龍懷抱幼主、七進七出於萬軍之中。\n\n換你來當這位「一身是膽」的虎將。',
      buttons:[{label:'開始',go:()=>{ hideCard(); setScene(MAP,'map'); }}],
      narrate:'趙雲七進七出。換你來當這位一身是膽的虎將。'}); },
  update(dt){ this.t+=dt; updateP(dt); },
  draw(){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#241f18'); g.addColorStop(1,'#15110c');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctext('趙雲七進七出',W/2,H/2-10,40,'#ece2c8',900); ctext('長坂坡 · 二〇八',W/2,H/2+34,18,'#b9a880',700); }
};

/* ===========================================================
   主迴圈
   =========================================================== */
let nowt=0, last=0;
function loop(ts){ nowt=ts/1000; const dt=Math.min(.05, last?(ts-last)/1000:.016); last=ts;
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0)shakeAmt=0; }
  if(toastT>0 && scene!==MAP) toastT-=dt;
  if(scene){ if(scene.update)scene.update(dt); ctx.clearRect(0,0,W,H); if(scene.draw)scene.draw(); }
  // TSO：進度一有變動（過關）就存檔
  if(progress!==savedProgress){ savedProgress=progress; try{ localStorage.setItem(SAVE_KEY,String(progress)); }catch(e){} }
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize(); setScene(TITLE,'title'); requestAnimationFrame(loop);

})();
</script>
