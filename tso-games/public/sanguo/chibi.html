<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>赤壁妙計大冒險</title>
<!-- TSO：本檔併入 TSO Games 時的修改處，都以「TSO：」註記 -->
<!-- TSO：未登入就退回 TSO 首頁（比照遊戲島，只擋一般使用者） -->
<script>try { if (sessionStorage.getItem('tsoAuth') !== 'ok') location.replace('../'); } catch (e) { location.replace('../'); }</script>
<style>
  :root{
    --ink:#2a2320; --paper:#fbf3e2; --paper2:#f3e7cd;
    --gold:#f2b441; --gold-d:#d8951f; --red:#e2533b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #f6efe0 0%, #ead9bb 60%, #d8c39c 100%);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:10px;
    user-select:none; -webkit-user-select:none;
  }
  #game{
    position:relative; width:100%; max-width:860px;
    /* TSO：寬度也受高度限制，手機橫拿時才不會裁掉上下（20px＝body 上下 padding） */
    max-width:min(860px, calc((100vh - 20px) * 800 / 560));
    max-width:min(860px, calc((100dvh - 20px) * 800 / 560));
    aspect-ratio:800/560;
    border-radius:22px; overflow:hidden;
    box-shadow:0 14px 40px rgba(60,40,15,.35);
    background:#cfe3e6;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none;}
  #top{
    position:absolute; left:0; top:0; right:0;
    display:flex; gap:8px; align-items:center;
    padding:10px; pointer-events:none; z-index:5;
  }
  #top .sp{flex:1;}
  .iconbtn{
    pointer-events:auto;
    width:46px; height:46px; border:none; border-radius:14px;
    background:rgba(255,255,255,.85); color:var(--ink);
    font-size:22px; cursor:pointer; box-shadow:0 3px 0 rgba(120,90,40,.3);
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(120,90,40,.3);}
  .iconbtn.off{opacity:.45;}
  #backbtn{margin-right:auto; padding:0 16px; width:auto; font-size:18px; font-weight:700;}
  #card{
    position:absolute; inset:0; z-index:8;
    display:flex; align-items:center; justify-content:center;
    padding:22px; background:rgba(30,22,14,.34);
    opacity:0; visibility:hidden; transition:opacity .25s;
  }
  #card.show{opacity:1; visibility:visible;}
  .panel{
    width:min(92%,560px); background:linear-gradient(180deg,var(--paper),var(--paper2));
    border-radius:22px; padding:26px 24px 24px;
    box-shadow:0 16px 36px rgba(40,25,8,.4); border:3px solid #e7d4ac;
    text-align:center;
  }
  .panel .emoji{font-size:46px; line-height:1;}
  .panel h1{margin:.3em 0 .1em; font-size:clamp(22px,5.4vw,32px); color:#7a4b1c;}
  .panel p{margin:.5em 0 0; font-size:clamp(16px,3.8vw,20px); line-height:1.6; color:#4a3a26; white-space:pre-line;}
  .row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
  .bigbtn{
    border:none; cursor:pointer;
    font-size:clamp(19px,4.6vw,24px); font-weight:800; color:#5a3a12;
    padding:14px 28px; border-radius:18px;
    background:linear-gradient(180deg,#ffd576,var(--gold));
    box-shadow:0 5px 0 var(--gold-d), 0 8px 18px rgba(180,120,20,.35);
  }
  .bigbtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--gold-d);}
  .bigbtn.ghost{background:linear-gradient(180deg,#fff,#efe2c6); color:#7a4b1c; box-shadow:0 5px 0 #cbb482;}
  #fab{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:6; border:none; cursor:pointer;
    font-size:clamp(22px,5.6vw,28px); font-weight:900; color:#fff;
    padding:15px 38px; border-radius:50px; letter-spacing:2px;
    background:linear-gradient(180deg,#ff8a4a,#e2533b);
    box-shadow:0 6px 0 #ad3622, 0 10px 22px rgba(180,50,20,.45);
    display:none;
  }
  #fab:active{transform:translateX(-50%) translateY(3px); box-shadow:0 3px 0 #ad3622;}
  #fab.pulse{animation:pls 1s ease-in-out infinite;}
  @keyframes pls{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.06);}}
  @media (prefers-reduced-motion: reduce){ #fab.pulse{animation:none;} }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="top">
    <button id="backbtn" class="iconbtn">↩ 地圖</button>
    <span class="sp"></span>
    <button id="readbtn" class="iconbtn" title="念故事">🔊</button>
    <button id="soundbtn" class="iconbtn" title="聲音">🎵</button>
  </div>
  <button id="fab"></button>
  <div id="card"><div class="panel" id="panel"></div></div>
</div>
<script>
(function(){
"use strict";

/* ===== 基本常數與畫布 ===== */
const W=800, H=560;
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const card=document.getElementById('card'), panel=document.getElementById('panel');
const fab=document.getElementById('fab');
const backbtn=document.getElementById('backbtn');
const readbtn=document.getElementById('readbtn'), soundbtn=document.getElementById('soundbtn');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let DPR=Math.min(2, window.devicePixelRatio||1);
let progress=0;          // 已完成關卡數 0..4
/* TSO：記住已過幾關。只存一個整數，讀回時檢查範圍，不合法就清掉從頭開始 */
const SAVE_KEY='sanguo_chibi_progress', MAX_PROGRESS=4;
try{ const n=Number(localStorage.getItem(SAVE_KEY));
  if(Number.isInteger(n) && n>=0 && n<=MAX_PROGRESS) progress=n; else localStorage.removeItem(SAVE_KEY); }catch(e){}
let savedProgress=progress;

function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ===== 小工具 ===== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function hexc(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function mix(a,b,t){ t=clamp(t,0,1); const A=hexc(a),B=hexc(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function rrFill(x,y,w,h,r,col){ ctx.fillStyle=col; rr(x,y,w,h,r); ctx.fill(); }
function ctext(str,x,y,size,col,weight){ ctx.fillStyle=col||'#fff';
  ctx.font=(weight||700)+' '+size+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(str,x,y); }

/* ===== 共用繪圖 ===== */
function drawSky(c1,c2){ const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
function drawWater(top,c1,c2,t){ const g=ctx.createLinearGradient(0,top,0,H);
  g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.fillRect(0,top,W,H-top);
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=2;
  for(let i=0;i<5;i++){ const y=top+22+i*((H-top-22)/5); ctx.beginPath();
    for(let x=0;x<=W;x+=16) ctx.lineTo(x, y+Math.sin(x*0.03+t*1.6+i)*4); ctx.stroke(); } }
function drawWarShip(x,y,col){ ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-40,0); ctx.lineTo(40,0);
  ctx.quadraticCurveTo(34,26,16,30); ctx.lineTo(-16,30); ctx.quadraticCurveTo(-34,26,-40,0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-40,-6,80,8);
  ctx.strokeStyle='#5a3f22'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(0,-54); ctx.stroke();
  ctx.fillStyle='#eadfc5'; ctx.beginPath(); ctx.moveTo(2,-50); ctx.lineTo(28,-44);
  ctx.lineTo(28,-14); ctx.lineTo(2,-10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f0c89a'; ctx.beginPath(); ctx.arc(-16,-12,6,0,7); ctx.fill();
  ctx.fillStyle='#c0392b'; ctx.fillRect(-22,-8,12,7);
  ctx.restore(); }
function drawFireBoat(x,y){ ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#3a2a22'; ctx.beginPath(); ctx.moveTo(-34,0); ctx.lineTo(34,0);
  ctx.quadraticCurveTo(28,22,12,26); ctx.lineTo(-12,26); ctx.quadraticCurveTo(-28,22,-34,0);
  ctx.closePath(); ctx.fill(); ctx.restore(); emitFire(x,y-12,2); }
function chainLink(x1,y1,x2,y2){ ctx.save(); ctx.setLineDash([8,5]);
  ctx.strokeStyle='#777'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); }

/* HUD */
function hudCount(str){ rrFill(W/2-92,14,184,42,16,'rgba(43,35,32,.78)'); ctext(str,W/2,36,24,'#ffe7a8',800); }
function windGauge(dir,zone){ const w=300,x=W/2-w/2,y=H-58,h=18;
  rrFill(x,y,w,h,9,'rgba(255,255,255,.5)');
  rrFill(x+w*0.70,y,w*0.30,h,9,'rgba(120,210,90,.85)');
  const pos=dir*0.5+0.5, mx=x+pos*w;
  rrFill(mx-7,y-6,14,h+12,7, zone?'#3e8e2e':'#c0392b');
  ctext('吹向曹營→', x+w*0.86, y-16, 14, '#2e6b1e', 800); }

/* ===== 粒子 ===== */
const P=[];
function pPush(o){ if(P.length<500) P.push(o); }
function emitFire(x,y,n){ n=reduce?Math.ceil(n/2):n; for(let i=0;i<n;i++)
  pPush({k:'fire',x:x+rand(-8,8),y:y+rand(-6,6),vx:rand(-22,22),vy:rand(-72,-30),g:0,life:rand(.4,.9),max:.9,r:rand(6,12),col:'fire'}); }
function emitSmoke(x,y,n){ n=reduce?Math.ceil(n/2):n; for(let i=0;i<n;i++)
  pPush({k:'smoke',x:x+rand(-8,8),y:y,vx:rand(-12,12),vy:rand(-30,-12),g:0,life:rand(1,1.8),max:1.8,r:rand(8,16),col:'rgba(70,60,55,'}); }
function emitSplash(x,y,n){ for(let i=0;i<(reduce?3:n);i++)
  pPush({k:'splash',x:x,y:y,vx:rand(-60,60),vy:rand(-120,-40),g:320,life:rand(.4,.8),max:.8,r:rand(3,6),col:'rgba(185,215,225,'}); }
function emitSpark(x,y,n,c){ for(let i=0;i<n;i++)
  pPush({k:'spark',x:x,y:y,vx:rand(-95,95),vy:rand(-165,-40),g:260,life:rand(.4,.9),max:.9,r:rand(2,4),col:c||'fire'}); }
function winFanfare(){ for(let i=0;i<36;i++)
  pPush({k:'spark',x:W/2+rand(-130,130),y:H/2+rand(-50,40),vx:rand(-150,150),vy:rand(-230,-70),g:260,life:rand(.8,1.5),max:1.5,r:rand(3,6),col:(i%3?'rgba(255,210,90,':'rgba(255,120,90,')}); }
function updateP(dt){ for(let i=P.length-1;i>=0;i--){ const p=P[i];
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt; if(p.k==='fire')p.vy-=40*dt; p.life-=dt;
  if(p.life<=0) P.splice(i,1); } }
function drawP(){
  ctx.globalCompositeOperation='lighter';
  for(const p of P){ if(p.k!=='fire'&&p.k!=='spark')continue; const a=Math.max(0,p.life/p.max);
    if(p.col==='fire'){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,'rgba(255,240,180,'+a+')'); g.addColorStop(.5,'rgba(255,150,40,'+(a*.8)+')');
      g.addColorStop(1,'rgba(220,60,20,0)'); ctx.fillStyle=g; }
    else ctx.fillStyle=p.col+a+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalCompositeOperation='source-over';
  for(const p of P){ if(p.k==='fire'||p.k==='spark')continue; const a=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col+(a*.7)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } }

/* ===== 畫面震動 / 提示 ===== */
let shakeT=0, shakeAmt=0;
function shake(a){ if(reduce)return; shakeT=0.4; shakeAmt=a*10; }
let toast=null, toastT=0;
function flash(msg){ toast=msg; toastT=1.5; }

/* ===== 音效（WebAudio 合成，零音檔） ===== */
let actx=null, soundOn=true, readOn=true;
function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tone(f,dur,type,vol,when){ if(!soundOn)return; const a=AC(); if(!a)return;
  const t0=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.3,t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.03); }
function noise(dur,vol,ff,when){ if(!soundOn)return; const a=AC(); if(!a)return;
  const t0=a.currentTime+(when||0), len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(); src.buffer=buf;
  const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=ff||1200;
  const g=a.createGain(); g.gain.value=vol||.3;
  src.connect(fl).connect(g).connect(a.destination); src.start(t0); }
const SFX={
  tap:()=>tone(420,.06,'square',.12),
  catch:()=>{ tone(680,.07,'triangle',.25); tone(1020,.06,'triangle',.18,.04); },
  chain:()=>{ tone(300,.05,'square',.2); tone(520,.06,'square',.18,.05); },
  wind:()=>{ noise(.6,.25,800); tone(440,.5,'sine',.12); },
  ignite:()=>{ noise(.5,.4,900); tone(110,.5,'sawtooth',.22); },
  spread:()=>noise(.3,.22,1000),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.25,i*.12)),
  fail:()=>{ tone(300,.2,'sine',.2); tone(220,.25,'sine',.18,.12); }
};
function tap(){ SFX.tap(); }

/* ===== 語音念故事 ===== */
function speak(text){ if(!readOn||!('speechSynthesis'in window))return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW'; u.rate=.96; u.pitch=1.05; speechSynthesis.speak(u); }catch(e){} }

/* ===== UI 卡片 / 浮動按鈕 ===== */
function showCard(o){
  let html='';
  if(o.emoji) html+='<div class="emoji">'+o.emoji+'</div>';
  if(o.title) html+='<h1>'+o.title+'</h1>';
  if(o.body) html+='<p>'+o.body+'</p>';
  html+='<div class="row">';
  (o.buttons||[]).forEach((b,i)=>{ html+='<button class="bigbtn '+(b.cls||'')+'" data-i="'+i+'">'+b.label+'</button>'; });
  html+='</div>';
  panel.innerHTML=html; card.classList.add('show');
  panel.querySelectorAll('.bigbtn').forEach(btn=>{ btn.onclick=()=>{ const b=(o.buttons||[])[+btn.dataset.i]; tap(); if(b&&b.go)b.go(); }; });
  if(o.narrate) speak(o.narrate);
}
function hideCard(){ card.classList.remove('show'); }
function hideFab(){ fab.style.display='none'; fab.classList.remove('pulse'); fab.onclick=null; }

/* ===== 場景管理 ===== */
let scene=null;
function setScene(s,name){ hideCard(); hideFab(); P.length=0; toastT=0; scene=s;
  backbtn.style.display=(name&&name.indexOf('level')===0)?'flex':'none';
  if(s&&s.enter) s.enter(); }

/* 通關後：標記進度、顯示成功卡 */
function levelClear(idx,title,body){ progress=Math.max(progress,idx+1);
  showCard({emoji:'🎉', title:title, body:body, buttons:[{label:'回地圖',go:()=>setScene(MAP,'map')}], narrate:title}); }

/* 結局 */
function showEnding(){ for(let i=0;i<3;i++) winFanfare();
  showCard({emoji:'🏆', title:'你贏了赤壁之戰！',
    body:'草船借箭、鐵索連環、借東風、火燒連環船——\n你用四個妙計打贏了曹操，曹操只好帶兵撤退！\n（這些都是《三國演義》裡有名的故事喔。）',
    buttons:[{label:'再玩一次',go:()=>setScene(MAP,'map')},{label:'從頭開始',cls:'ghost',go:()=>{ progress=0; setScene(MAP,'map'); }}],
    narrate:'你贏了赤壁之戰！你用四個妙計打贏了曹操，曹操只好撤退。'}); }

/* 開場 */
function showTitle(){ showCard({emoji:'⛵', title:'赤壁妙計大冒險',
  body:'西元 208 年，曹操帶著好多好多大船來了！\n你要幫孫權和劉備，用四個聰明的妙計打贏他。\n準備好了嗎？',
  buttons:[{label:'開始冒險！',go:()=>hideCard()}],
  narrate:'赤壁妙計大冒險。幫孫權和劉備，用四個聰明的妙計打贏曹操。準備好了嗎？'}); }

/* ===== 輸入 ===== */
function evToLogic(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); AC(); const p=evToLogic(e); if(scene&&scene.onDown)scene.onDown(p.x,p.y); });
cv.addEventListener('pointermove',e=>{ const p=evToLogic(e); if(scene&&scene.onMove)scene.onMove(p.x,p.y); });
window.addEventListener('pointerup',e=>{ if(scene&&scene.onUp)scene.onUp(); });
window.addEventListener('keydown',e=>{ if(scene&&scene.onKey)scene.onKey(e); });

/* 頂部按鈕 */
readbtn.onclick=()=>{ readOn=!readOn; readbtn.classList.toggle('off',!readOn);
  if(!readOn&&'speechSynthesis'in window)speechSynthesis.cancel(); tap(); };
soundbtn.onclick=()=>{ soundOn=!soundOn; soundbtn.classList.toggle('off',!soundOn); tap(); };
backbtn.onclick=()=>{ tap(); setScene(MAP,'map'); };

const BOATY=H-150;  // 第一關草船甲板基準 y

/* ===== 本版新增的繪圖／粒子小工具 ===== */
function emitLeaf(x,y,dir){ for(let i=0;i<(reduce?2:4);i++)
  pPush({k:'leaf',x:x+rand(-10,10),y:y+rand(-8,8),vx:dir*rand(70,150),vy:rand(-40,10),g:50,life:rand(.8,1.4),max:1.4,r:rand(3,6),col:'rgba(150,180,90,'}); }
function drawStrawMen(x,wy,stuck,burning){ ctx.save(); ctx.translate(x,wy);
  ctx.fillStyle='#6b4a2a'; ctx.beginPath(); ctx.moveTo(-80,0); ctx.lineTo(80,0);
  ctx.quadraticCurveTo(66,30,34,34); ctx.lineTo(-34,34); ctx.quadraticCurveTo(-66,30,-80,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#85613a'; ctx.fillRect(-80,-6,160,8);
  const hot=burning>0;
  for(let i=0;i<5;i++){ const mx=-56+i*28;
    ctx.fillStyle=hot?'#cf7a36':'#d9b45a'; rr(mx-9,-40,18,36,6); ctx.fill();
    ctx.strokeStyle=hot?'#cf7a36':'#caa24c'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(mx-9,-30); ctx.lineTo(mx-18,-22);
    ctx.moveTo(mx+9,-30); ctx.lineTo(mx+18,-22); ctx.stroke();
    ctx.fillStyle=hot?'#caa07a':'#e7cf94'; ctx.beginPath(); ctx.arc(mx,-46,7,0,7); ctx.fill();
    ctx.fillStyle='#9c7b3e'; ctx.beginPath(); ctx.moveTo(mx-12,-49); ctx.lineTo(mx+12,-49); ctx.lineTo(mx,-60); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle='#4a3826'; ctx.lineWidth=3; ctx.lineCap='round';

  enter(){ this.t=0; this.done=false; this.allT=0; this.spawnT=0;
    this.fb={x:W/2,y:H-80,target:W/2,hitCd:0}; this.lives=5; this.maxLives=5; const n=6; this.ships=[];
    for(let i=0;i<n;i++) this.ships.push({x:160+i*96,y:172,fire:0,lit:false,sink:0});
    this.patrols=[{x:200,y:300,vx:95},{x:560,y:352,vx:-110}];
    showCard({emoji:'🔥', title:'第四計　火燒連環船',
      body:'東風來了！拖著火船往上衝，把六艘大船一艘一艘都撞到放火。\n\n你有 5 艘火船（左上角），撞到中間的巡邏船會沉一艘，沉光就輸了。\n把六艘敵船全燒起來就贏！',
      buttons:[{label:'放火船！衝啊！',go:()=>{ hideCard(); this.running=true; SFX.ignite(); shake(0.3); speak('拖著火船往上衝，把六艘大船都撞到放火，閃開巡邏船。'); }}],
      narrate:'第四計，火燒連環船。拖著火船往上衝，把六艘大船都撞到放火，閃開巡邏船。'}); },
  onDown(x){ if(!this.running)return; this.drag=true; this.fb.target=clamp(x,40,W-40); },
  onMove(x){ if(this.drag&&this.running) this.fb.target=clamp(x,40,W-40); },
  onUp(){ this.drag=false; },
  ram(){ let idx=-1,best=1e9; for(let i=0;i<this.ships.length;i++){ if(this.ships[i].lit)continue;
      const d=Math.abs(this.ships[i].x-this.fb.x); if(d<best){best=d;idx=i;} }
    this.fb.y=H-80; if(idx<0)return;
    const s=this.ships[idx]; s.lit=true;
    emitFire(s.x,s.y,12); emitSpark(s.x,s.y-10,8,'fire'); SFX.spread(); shake(0.3); },
  update(dt){ this.t+=dt; if(this.fb.hitCd>0)this.fb.hitCd-=dt; if(!this.running)return;
    this.fb.x=lerp(this.fb.x,this.fb.target,0.2);
    this.fb.y-=160*dt; emitFire(this.fb.x,this.fb.y+10,2);
    if(this.fb.y<=this.ships[0].y+22) this.ram();
    this.spawnT-=dt; if(this.spawnT<=0 && this.patrols.length<5){ this.spawnT=7;
      const lane=this.patrols.length%2?352:300, d=Math.random()<.5?1:-1;
      this.patrols.push({x:d>0?-30:W+30,y:lane,vx:d*rand(80,130)}); }
    for(const p of this.patrols){ p.x+=p.vx*dt; if(p.x<-60)p.x=W+60; if(p.x>W+60)p.x=-60;
      if(this.fb.hitCd<=0 && Math.abs(this.fb.x-p.x)<38 && Math.abs(this.fb.y-p.y)<26){
        this.fb.hitCd=0.9; this.lives--; this.fb.y=H-80; emitSplash(this.fb.x,this.fb.y-20,8);
        SFX.fail(); shake(0.3); flash(this.lives>0?('火船被撞沉！剩 '+this.lives+' 艘'):'火船都沉了！');
        if(this.lives<=0){ this.failLevel(); return; } } }
    for(let i=0;i<this.ships.length;i++){ const s=this.ships[i]; if(!s.lit)continue;
      s.fire=Math.min(1,s.fire+dt*0.5);
      if(Math.random()<(reduce?.3:.8)) emitFire(s.x+rand(-22,22),s.y-8-s.fire*18,1);
      if(Math.random()<.3) emitSmoke(s.x+rand(-18,18),s.y-26-s.fire*18,1);
      if(s.fire>=1) s.sink=Math.min(1,s.sink+dt*0.2); }
    if(this.ships.every(s=>s.lit && s.fire>=1)){ this.allT+=dt; if(this.allT>1 && !this.done) this.winLevel(); } },
  winLevel(){ this.done=true; this.running=false; progress=4; SFX.win(); winFanfare(); setTimeout(()=>showEnding(),800); },
  failLevel(){ this.done=true; this.running=false; SFX.fail();
    showCard({emoji:'🚢', title:'火船都沉了…', body:'撞到太多巡邏船了。\n閃開巡邏船，把六艘敵船都撞到放火，再試一次！',
      buttons:[{label:'再試一次',go:()=>setScene(L4,'level4')}], narrate:'火船都被撞沉了，再試一次！'}); },
  draw(){ const lit=this.ships.filter(s=>s.lit).length, glow=Math.min(1,lit/4);
    drawSky(mix('#1b2740','#3a1c14',glow),mix('#2a3a55','#5a241a',glow));
    ctx.fillStyle='rgba(245,240,210,.9)'; ctx.beginPath(); ctx.arc(W*0.16,H*0.18,28,0,7); ctx.fill();
    drawWater(150,mix('#274a63','#5a2a1c',glow),mix('#16364b','#3a1810',glow),this.t);
    ctx.strokeStyle='#555'; ctx.setLineDash([8,5]); ctx.lineWidth=5;
    for(let i=0;i<this.ships.length-1;i++) { ctx.beginPath(); ctx.moveTo(this.ships[i].x+30,this.ships[i].y-6); ctx.lineTo(this.ships[i+1].x-30,this.ships[i+1].y-6); ctx.stroke(); }
    ctx.setLineDash([]);
    for(const s of this.ships){ ctx.save(); ctx.translate(0,(s.sink||0)*22); ctx.globalAlpha=1-(s.sink||0)*0.5;
      drawWarShip(s.x,s.y, s.lit?mix('#4e79b0','#3a2a22',s.fire):'#4e79b0'); ctx.restore(); }
    for(const p of this.patrols) drawPatrolBoat(p.x,p.y);
    if(this.running) drawFireBoat(this.fb.x,this.fb.y);
    drawP();
    if(this.running||this.done){ hudCount('🔥 燒了 '+lit+' / '+this.ships.length); boatHP(this.lives,this.maxLives,'火船','#ffd089','#7a2a1a','#ff8a4a'); }
    if(this.running) ctext('拖火船撞遍每一艘敵船，閃開巡邏船！',W/2,H-26,18,'#ffd089',800); }
};

/* ============================================================
   主畫面：長江妙計地圖
   ============================================================ */
function drawHills(){ ctx.fillStyle='#cdbf95';
  ctx.beginPath(); ctx.moveTo(0,H); ctx.quadraticCurveTo(160,H-70,360,H-30);
  ctx.quadraticCurveTo(560,H+10,800,H-60); ctx.lineTo(800,H); ctx.closePath(); ctx.fill(); }
function drawRiverPath(){ ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(90,150,180,.55)'; ctx.lineWidth=34;
  ctx.beginPath(); ctx.moveTo(40,505); ctx.lineTo(STOPS[0].x,STOPS[0].y);
  for(let i=1;i<STOPS.length;i++){ const a=STOPS[i-1],b=STOPS[i];
    ctx.quadraticCurveTo((a.x+b.x)/2,Math.min(a.y,b.y)-22,b.x,b.y); }
  ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=6; ctx.stroke(); }
function drawMapBoat(x,y,t){ ctx.save(); ctx.translate(x,y+Math.sin(t*2)*3);
  ctx.fillStyle='#7a4b1c'; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0);
  ctx.quadraticCurveTo(12,9,5,11); ctx.lineTo(-5,11); ctx.quadraticCurveTo(-12,9,-16,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#5a3f22'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(0,-18); ctx.stroke();
  ctx.fillStyle='#e2533b'; ctx.beginPath(); ctx.moveTo(1,-16); ctx.lineTo(12,-13);
  ctx.lineTo(12,-4); ctx.lineTo(1,-3); ctx.closePath(); ctx.fill(); ctx.restore(); }

const STOPS=[
  {name:'草船借箭',  icon:'🏹', x:150, y:432, go:()=>setScene(L1,'level1')},
  {name:'鐵索連環',  icon:'⛓️', x:330, y:300, go:()=>setScene(L2,'level2')},
  {name:'借東風',    icon:'🍃', x:520, y:390, go:()=>setScene(L3,'level3')},
  {name:'火燒連環船',icon:'🔥', x:690, y:258, go:()=>setScene(L4,'level4')}
];
const MAP={
  enter(){ this.t=0; },
  onDown(x,y){ for(let i=0;i<STOPS.length;i++){ if(i>progress)continue;
    if(Math.hypot(x-STOPS[i].x,y-STOPS[i].y)<46){ tap(); STOPS[i].go(); return; } } },
  onKey(e){ const n=parseInt(e.key,10); if(n>=1&&n<=4&&(n-1)<=progress){ tap(); STOPS[n-1].go(); } },
  update(dt){ this.t+=dt; },
  draw(){ drawSky('#bcd9e6','#e7f2f3'); ctx.fillStyle='#e9dcb8'; ctx.fillRect(0,120,W,H-120);
    drawHills(); drawRiverPath();
    ctext('赤壁妙計大冒險',W/2,52,36,'#7a4b1c',900);
    ctext('幫孫權和劉備，用四個妙計打贏曹操！',W/2,90,18,'#8a6a3a',700);
    for(let i=0;i<STOPS.length;i++){ const s=STOPS[i], unlocked=i<=progress, done=i<progress;
      const r=38+(unlocked?Math.sin(this.t*3+i)*2:0);
      ctx.fillStyle=unlocked?'#fff':'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(s.x,s.y,r,0,7); ctx.fill();
      ctx.lineWidth=5; ctx.strokeStyle=done?'#7ec850':(unlocked?'#f2b441':'#b0a584'); ctx.stroke();
      ctext(unlocked?s.icon:'🔒',s.x,s.y-1,30,'#000');
      rrFill(s.x-58,s.y+r,116,26,12,unlocked?'rgba(122,75,28,.92)':'rgba(120,110,90,.85)');
      ctext((i+1)+'. '+s.name,s.x,s.y+r+13,15,'#fff',800);
      if(done) ctext('✓',s.x+30,s.y-28,26,'#2faa3a',900); }
    const cur=STOPS[Math.min(progress,3)]; drawMapBoat(cur.x-52,cur.y,this.t);
    if(progress<4) ctext('點亮著的站開始玩 ▶',W/2,H-26,18,'#8a6a3a',800);
    else ctext('全部完成！可以重玩任何一關 🎉',W/2,H-26,18,'#7a4b1c',800);
    drawP(); }
};

/* ============================================================
   主迴圈與啟動
   ============================================================ */
let last=0;
function loop(ts){ const dt=Math.min(.05, last?(ts-last)/1000:0); last=ts;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shakeT>0){ shakeT-=dt; const k=Math.max(0,shakeT/0.4)*shakeAmt; ctx.translate(rand(-k,k),rand(-k,k)); }
  if(scene){ if(scene.update)scene.update(dt); if(scene.draw)scene.draw(); }
  ctx.restore();
  updateP(dt);
  if(toastT>0){ toastT-=dt; ctx.globalAlpha=Math.min(1,toastT*1.5);
    rrFill(W/2-170,H/2-26,340,52,16,'rgba(43,35,32,.92)'); ctext(toast,W/2,H/2,22,'#ffd089',800); ctx.globalAlpha=1; }
  // TSO：進度一有變動（過關或「從頭開始」）就存檔
  if(progress!==savedProgress){ savedProgress=progress; try{ localStorage.setItem(SAVE_KEY,String(progress)); }catch(e){} }
  requestAnimationFrame(loop); }

resize(); window.addEventListener('resize',resize);
setScene(MAP,'map'); showTitle();
requestAnimationFrame(loop);

})();
</script>
