name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tso-games/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tso-games

      - name: Build
        run: npm run build
        working-directory: tso-games

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: tso-games/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署失敗時自動開 issue：merge 成功不等於發布成功，
  # 2026-07-02 曾有失敗的部署無人察覺，線上停留在舊版本達 4 天
  notify-failure:
    needs: [build, deploy]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `部署失敗：${context.sha.substring(0,7)}（run #${context.runNumber}）`,
              body: [
                'main 的部署流程失敗，線上版本可能仍停留在舊 commit。',
                '',
                `- commit: ${context.sha}`,
                `- run: ${runUrl}`,
                '',
                '請確認 https://chobittso-ai.github.io/Tso/ 目前的版本。'
              ].join('\n')
            })
